<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/dashboard-layout :: page(
          'Create User',
          'dashboard',
          '',
          '',
          'dashboard',
          ~{:: #admin-create-user-content}
      )}">
<body>
<th:block id="admin-create-user-content">

            <div th:replace="~{fragments/components :: dashboard-chrome(
                @{/admin/dashboard}, 'Dashboard',
                null, null,
                'USER MANAGEMENT',
                'Create User',
                'Create a provider, applicant, or admin account directly, bypassing self-registration.',
                null)}"></div>

            <div th:if="${errorMessage}" class="alert alert-danger rounded-3 py-2 small mb-3" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
            </div>

            <div class="card sz-section-card">
                <div class="card-body p-4">

                    <form th:action="@{/admin/users/create}"
                          method="post"
                          enctype="multipart/form-data"
                          th:object="${createUserRequest}">

                        <input type="hidden" th:replace="~{fragments/layout :: csrf}">

                        <div class="row g-3">

                            <div class="col-12 col-md-6">
                                <label class="form-label">Full name</label>
                                <input type="text" class="form-control" th:field="*{fullName}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" th:field="*{phone}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Role</label>
                                <select class="form-select" th:field="*{role}">
                                    <option value="">Select role</option>
                                    <option value="ROLE_APPLICANT">Applicant</option>
                                    <option value="ROLE_PROVIDER">Provider</option>
                                    <option value="ROLE_ADMIN" sec:authorize="hasRole('SUPER_ADMIN')">Admin</option>
                                </select>
                                <div class="form-text">Only a super admin can create Admin accounts.</div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{password}"
                                           autocomplete="new-password">
                                    <button type="button" class="btn btn-outline-secondary sz-password-toggle" aria-label="Show password">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <div class="form-text">Leave blank for Admin accounts — the new admin sets their own password via the confirmation email.</div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Confirm password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{confirmPassword}"
                                           autocomplete="new-password">
                                    <button type="button" class="btn btn-outline-secondary sz-password-toggle" aria-label="Show password">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Organisation type <span class="text-secondary fw-normal">(provider only)</span></label>
                                <select class="form-select" th:field="*{organisationType}">
                                    <option value="">Select type…</option>
                                    <option th:each="t : ${organisationTypes}" th:value="${t}"
                                            th:text="${T(com.scholarzim.util.ProviderOrgType).label(t)}">Type</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Registration number <span class="text-secondary fw-normal">(provider only)</span></label>
                                <input type="text" class="form-control" th:field="*{registrationNumber}">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Registration certificate (PDF) <span class="text-secondary fw-normal">(provider only)</span></label>
                                <input type="file" class="form-control" name="certificate" accept="application/pdf,.pdf">
                            </div>

                        </div>

                        <div class="mt-4">
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-person-plus me-1"></i>Create account
                            </button>
                        </div>

                    </form>

                </div>
            </div>

</th:block>
</body>
</html>
