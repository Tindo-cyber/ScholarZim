server.port=${PORT:8080}

# Render's free tier gives the whole container ~512MB total; Spring Boot's
# default Tomcat pool (max 200 threads) reserves far more thread-stack memory
# than this box can spare. Keep the pool small enough to leave headroom for
# the JVM heap/metaspace under real traffic.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# FYP/demo seed on by default so dashboards are not empty on Render.
# Set SCHOLARZIM_DEMO_SEED=false for a clean production DB with no sample accounts.
scholarzim.demo.seed=${SCHOLARZIM_DEMO_SEED:true}
logging.level.com.scholarzim=INFO
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health

# Mail is optional on Render — do not mark the app unhealthy when SMTP is unset
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.datasource.url=${SCHOLARZIM_DB_URL:jdbc:mysql://localhost:3306/scholarzim}
spring.datasource.username=${SCHOLARZIM_DB_USER:root}
spring.datasource.password=${SCHOLARZIM_DB_PASSWORD:root}

# SMTP is unused in prod (Render blocks outbound SMTP on its free tier, which is why
# password-reset emails were hanging/failing). Prod sends mail via MailgunEmailServiceImpl
# (below) over HTTPS instead. These spring.mail.* properties are harmless to leave set —
# Boot still auto-configures an unused JavaMailSender bean from them — but nothing reads it
# in prod since EmailServiceImpl (SMTP) is @Profile("!prod").
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

scholarzim.app.base-url=${SCHOLARZIM_APP_BASE_URL:https://www.scholarzim.com}
scholarzim.mail.from=${SCHOLARZIM_MAIL_FROM:noreply@scholarzim.com}

# Mailgun transactional email (prod only — see MailgunEmailServiceImpl).
# Defaults point at the Mailgun sandbox domain (only authorized recipients receive
# mail) — swap MAILGUN_DOMAIN/MAILGUN_FROM_EMAIL once a real sending domain is verified.
scholarzim.mailgun.api-key=${MAILGUN_API_KEY:}
scholarzim.mailgun.domain=${MAILGUN_DOMAIN:sandboxdaeabb4168e44044b93cb139993aecb3.mailgun.org}
scholarzim.mailgun.from-email=${MAILGUN_FROM_EMAIL:postmaster@sandboxdaeabb4168e44044b93cb139993aecb3.mailgun.org}
scholarzim.mailgun.from-name=${MAILGUN_FROM_NAME:ScholarZim}

scholarzim.upload.dir=${SCHOLARZIM_UPLOAD_DIR:uploads}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SCHOLARZIM_SESSION_COOKIE_SECURE:true}

spring.web.resources.cache.period=31536000
spring.web.resources.chain.cache=true
spring.thymeleaf.cache=true
scholarzim.assets.long-cache=true
scholarzim.assets.cache-purge=false
