services:
  - type: web
    name: scholarzim
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SCHOLARZIM_SESSION_COOKIE_SECURE
        value: "true"
      # FYP demo: set to "true" in the Render dashboard to seed sample users/scholarships
      - key: SCHOLARZIM_DEMO_SEED
        value: "true"
      # Mount a Render persistent disk at /var/data/uploads and set this to that path
      - key: SCHOLARZIM_UPLOAD_DIR
        value: /var/data/uploads
      # Aiven: jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
      - key: SCHOLARZIM_DB_URL
        sync: false
      - key: SCHOLARZIM_DB_USER
        sync: false
      - key: SCHOLARZIM_DB_PASSWORD
        sync: false
      - key: SCHOLARZIM_APP_BASE_URL
        sync: false
      - key: SCHOLARZIM_MAIL_FROM
        value: noreply@scholarzim.co.zw
      # Mailgun transactional email (Render blocks outbound SMTP, so this is the real send path —
      # set the API key in the Render dashboard; sync: false keeps it out of this file)
      - key: MAILGUN_API_KEY
        sync: false
      # scholarzim.co.zw is verified in Mailgun (DNS via Cloudflare, nameservers set by Webzim).
      - key: MAILGUN_DOMAIN
        value: scholarzim.co.zw
      - key: MAILGUN_FROM_EMAIL
        value: noreply@scholarzim.co.zw
      - key: MAILGUN_FROM_NAME
        value: ScholarZim
