services:
  - type: web
    name: scholarzim
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # A dedicated check rather than "/": the landing page runs the public stats
    # queries, and a health probe should not be the heaviest request on the box.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate once with `php artisan key:generate --show` and paste it into
      # the Render dashboard; without a stable key every deploy logs users out.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Harare
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Mail leaves the request that triggered it; the supervised queue worker
      # in the image drains the jobs table.
      - key: QUEUE_CONNECTION
        value: database
      # FYP demo: set to "true" in the Render dashboard to seed sample users/scholarships
      - key: SCHOLARZIM_DEMO_SEED
        value: "true"
      # Aiven or any managed MySQL 8
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render blocks outbound SMTP on the free tier, so Mailgun's HTTP API is
      # the real send path. Set MAILGUN_DOMAIN and MAILGUN_SECRET in the
      # dashboard (from the Mailgun control panel); MAILGUN_ENDPOINT only
      # needs to change to api.eu.mailgun.net for an EU-region domain.
      - key: MAIL_MAILER
        value: mailgun
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_SECRET
        sync: false
      - key: MAILGUN_ENDPOINT
        value: api.mailgun.net
      - key: MAIL_FROM_ADDRESS
        value: noreply@scholarzim.co.zw
      - key: MAIL_FROM_NAME
        value: ScholarZim
      # Mount a Render persistent disk here so uploaded documents survive deploys
    disk:
      name: scholarzim-uploads
      mountPath: /var/www/html/storage/app
      sizeGB: 1
