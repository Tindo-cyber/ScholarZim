services:
  - type: web
    name: scholarzim
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # A dedicated check rather than "/": the landing page runs the public stats
    # queries, and a health probe should not be the heaviest request on the box.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate once with `php artisan key:generate --show` and paste it into
      # the Render dashboard; without a stable key every deploy logs users out.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Harare
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Render terminates TLS at its own load balancer, so the container only
      # ever sees plain HTTP and learns the real scheme from X-Forwarded-Proto.
      # Without a trusted proxy that header is discarded, $request->secure()
      # stays false, and every absolute URL the app generates comes out http://
      # - including the verification and password-reset links mailed to users,
      # which then arrive on a scheme that SESSION_SECURE_COOKIE above refuses
      # to send the session cookie over. docker-compose.prod.yml already sets
      # this; Render was the deployment path missing it.
      #
      # "*" trusts whichever host forwarded the request, which is correct only
      # because Render's proxy is the only route to the container. See
      # config/trustedproxy.php.
      - key: TRUSTED_PROXIES
        value: "*"
      # Mail leaves the request that triggered it; the supervised queue worker
      # in the image drains the jobs table.
      - key: QUEUE_CONNECTION
        value: database
      # Never "true" here. The seeder creates admin@, provider@ and
      # student@scholarzim.co.zw with a password that is written down in the
      # README, and it uses updateOrCreate - so every restart would reset those
      # accounts back to the published credentials on a public URL. It is a demo
      # fixture for a local database, not something a deployed instance runs.
      #
      # The entrypoint refuses it under APP_ENV=production regardless of this
      # value, and DatabaseSeeder refuses it a second time; this is the outermost
      # of the three.
      - key: SCHOLARZIM_DEMO_SEED
        value: "false"
      # Aiven or any managed MySQL 8.
      #
      # Host, port, database, user and password all come from the Aiven service
      # page and are set in the Render dashboard, never here - DB_PASSWORD is the
      # one real credential in this file's worth of configuration.
      #
      # DB_PORT has no default on purpose. Aiven assigns a per-service port
      # (16599 for this one), so a "3306" baked in here would be wrong for every
      # Aiven service and would fail as a connection timeout rather than as
      # anything that mentions a port.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven requires TLS, and this is the CA that verifies it. The certificate
      # itself is not an environment variable: upload it in the Render dashboard
      # under Environment -> Secret Files, named aiven-ca.pem, and the runtime
      # mounts it at the path below. Nothing about it is committed.
      #
      # Without this the connection is refused rather than silently downgraded,
      # so a forgotten secret file fails loudly at boot.
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      # Render blocks outbound SMTP on the free tier, so Mailgun's HTTP API is
      # the real send path. Set MAILGUN_DOMAIN and MAILGUN_SECRET in the
      # dashboard (from the Mailgun control panel); MAILGUN_ENDPOINT only
      # needs to change to api.eu.mailgun.net for an EU-region domain.
      #
      # Both are sync: false, which is correct - a secret does not belong in a
      # blueprint - but it means a deploy boots perfectly happily with neither
      # set and every email fails 401 inside EmailService, which catches the
      # throwable and returns false. Nothing downstream notices. Two things now
      # say so instead: docker/entrypoint.sh warns at boot, and
      # `php artisan mail:check` verifies the credentials against Mailgun
      # without sending anything (add --send=you@example.com for a real test).
      - key: MAIL_MAILER
        value: mailgun
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_SECRET
        sync: false
      - key: MAILGUN_ENDPOINT
        value: api.mailgun.net
      - key: MAIL_FROM_ADDRESS
        value: noreply@scholarzim.co.zw
      - key: MAIL_FROM_NAME
        value: ScholarZim
      # Cloudflare R2 (S3-compatible) object storage for uploaded documents.
      # Set these in the Render dashboard - they are secrets, never committed.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

# ---------------------------------------------------------------------------
# UPLOADED FILE STORAGE. READ BEFORE RELYING ON UPLOADS.
# ---------------------------------------------------------------------------
#
# FileStorageService resolves its disk at runtime from
# config('filesystems.default'), which is driven by FILESYSTEM_DISK. The
# envVars above set FILESYSTEM_DISK=s3, so every upload - applicant documents,
# results certificates, transcripts, provider registration certificates - lands
# in Cloudflare R2, not on the container's ephemeral filesystem.
#
# That is the durable path this deployment intends. Two notes:
#
#   1. If FILESYSTEM_DISK is ever changed back to `local`, documents return to
#      the container filesystem and are gone on every deploy and every
#      free-tier spin-down. The database rows (document_files.path and the
#      *_path columns on applicant_profiles, provider_profiles, applications)
#      would still reference paths whose files no longer exist. FileStorageService
#      detects that at download time and aborts_404 rather than erroring.
#
#   2. There is no persistent local disk attached. A persistent disk would
#      require `plan: starter` (or higher) and a `disk:` block - Render only
#      allows that combination on paid plans, and this service is `plan: free`.
#      See the commented-out example below for how that would be wired:
#
#        disk:
#          name: scholarzim-uploads
#          mountPath: /var/data/scholarzim
#          sizeGB: 1
#
#      docker/entrypoint.sh creates FILESYSTEM_ROOT and chowns it to the web
#      worker on every boot if it is set, so a freshly attached (root-owned)
#      disk becomes writable without any manual step.
#
#      But with FILESYSTEM_DISK=s3 the recommended approach is R2, which needs
#      no attached disk at all - the AWS_* env vars above configure it.
