; Sized for a small container. Uploads are capped here as well as in nginx and
; in the app's validation rules.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
expose_php = Off

; Refuse to execute a path that is not exactly the file requested.
;
; With the PHP default of 1, FPM will happily run /something.jpg/x.php by
; walking back up the path until it finds a file it can execute - so any
; uploaded file that lands inside the document root becomes executable through
; a crafted URL. Nothing here relies on PATH_INFO (nginx passes SCRIPT_FILENAME
; directly to Laravel's front controller), so turning it off costs nothing.
;
; Not a live hole today: uploads are written to the private disk outside
; public/, and nginx denies /storage outright. This is the third lock on a door
; that is already bolted, and it is one line.
cgi.fix_pathinfo = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
