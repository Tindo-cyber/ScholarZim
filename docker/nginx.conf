user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25M;
    server_tokens off;

    # Explicit temp path writable by the www-data worker. The nginx package's
    # default (/var/lib/nginx/tmp/client_body) is root-owned on Alpine and
    # causes EACCES before Laravel ever sees the upload body. Pointing this at
    # /tmp (world-traversable) and creating it with www-data ownership in the
    # Dockerfile and entrypoint closes the gap on every fresh deploy.
    client_body_temp_path /tmp/nginx-client-body 8 16;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Uploaded documents are served through the app so role checks apply;
        # nothing under storage/ is reachable directly.
        location ~ ^/(storage|vendor)/ {
            deny all;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
