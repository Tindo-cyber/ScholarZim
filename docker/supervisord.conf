; php-fpm and nginx serve the app; the scheduler tick is what keeps the daily
; reminder and alert jobs running, since there is no system cron in the image;
; and the queue worker is what drains the mail that requests no longer wait on.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; startsecs: php-fpm has to stay up this long before supervisor calls it
; started, so an FPM that dies on a bad extension or a broken pool config is
; reported as a failed start rather than flapping quietly behind nginx.
; It does NOT hold back the programs below - see the nginx note.
[program:php-fpm]
command=php-fpm -F
autorestart=true
startsecs=2
startretries=3
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx waits for FPM's socket before it starts.
;
; priority alone is not enough, and this is the trap worth writing down:
; supervisor has no dependency mechanism. Priority orders the spawn calls, but
; every autostart program is spawned in the same pass, microseconds apart -
; supervisor never waits for one to be RUNNING before starting the next. So
; nginx used to come up while php-fpm was still binding its socket, and the
; platform's first request - the health check, which arrives immediately -
; got "connect() failed (111: Connection refused) while connecting to
; upstream" and a 502.
;
; wait-for-fpm polls 127.0.0.1:9000 and execs nginx the moment it answers.
; That is a readiness gate, not a delay: a fast boot costs a couple of hundred
; milliseconds, a slow one waits as long as it needs, and an FPM that never
; comes up fails the program instead of serving 502s forever.
[program:nginx]
command=/usr/local/bin/wait-for-fpm nginx -g "daemon off;"
autorestart=true
startsecs=2
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
user=www-data
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Notifications are queued (QUEUE_CONNECTION=database), so approving a listing
; returns immediately instead of waiting on one SMTP round trip per applicant.
; Without this worker that mail would sit in the jobs table unsent.
;
; --max-time recycles the worker hourly: a long-lived PHP process holds its
; bootstrapped state, and a periodic restart is how queued code picks up a
; deploy without a manual bounce.
[program:queue]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
