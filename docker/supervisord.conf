; php-fpm and nginx serve the app; the scheduler tick is what keeps the daily
; reminder and alert jobs running, since there is no system cron in the image;
; and the queue worker is what drains the mail that requests no longer wait on.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
user=www-data
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Notifications are queued (QUEUE_CONNECTION=database), so approving a listing
; returns immediately instead of waiting on one SMTP round trip per applicant.
; Without this worker that mail would sit in the jobs table unsent.
;
; --max-time recycles the worker hourly: a long-lived PHP process holds its
; bootstrapped state, and a periodic restart is how queued code picks up a
; deploy without a manual bounce.
[program:queue]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
