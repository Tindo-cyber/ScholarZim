<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: page(
          'Saved Scholarships',
          'saved',
          'saved',
          '',
          '',
          ~{:: #saved-content}
      )}">
<body>
<th:block id="saved-content">

    <div class="sz-page-shell is-loaded" id="szSavedPage" data-page="scholarships">
        <div class="sz-page-shell__content">

            <div th:replace="~{fragments/components :: dashboard-chrome(
                @{/applicant/dashboard}, 'Dashboard',
                null, null,
                'YOUR SHORTLIST',
                'Saved Opportunities',
                'Keep track of scholarships and opportunities you may want to apply for.',
                null)}"></div>

            <div class="sz-opp-grid" th:if="${saved != null and !saved.isEmpty()}">
                <th:block th:each="opp : ${saved}">
                    <div th:replace="~{fragments/components :: scholarship-card(opportunity=${opp}, showApply=true, withApplyBtn=true, removeId=${opp.opportunityId}, matchScore=null, eligibilityText=null)}"></div>
                </th:block>
            </div>
            <th:block th:if="${saved == null or saved.isEmpty()}">
                <div th:replace="~{fragments/components :: empty-state(
                     'bi-bookmark-heart',
                     'No saved scholarships yet',
                     'Bookmark scholarships you are interested in and they will show up here so you can find them again easily.',
                     '/opportunities',
                     'Browse scholarships')}"></div>
            </th:block>

        </div>
    </div>

</th:block>
</body>
</html>
