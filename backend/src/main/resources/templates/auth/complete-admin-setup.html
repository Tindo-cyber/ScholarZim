<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/public-layout :: head('Set your password')}"></head>
<body class="sz-landing">

<div th:replace="~{fragments/public-layout :: skip-link}"></div>
<header th:replace="~{fragments/public-layout :: navbar}"></header>

<main id="main-content" tabindex="-1" class="sz-landing-main sz-auth-public">
    <div class="container sz-container py-4 py-md-5">
        <div class="sz-auth-public__inner">
            <div class="sz-auth-card">
                <div class="text-center mb-4">
                    <div class="sz-auth-brand-icon mx-auto"><i class="bi bi-shield-lock"></i></div>
                    <div class="sz-auth-brand h4 mb-1">Set your admin password</div>
                    <p class="sz-auth-muted small mb-0">Your email is confirmed. Choose a password to finish setting up your admin account.</p>
                </div>
                <form method="post" th:attr="action=@{/verify-email/{token}(token=${token})}">
                    <input type="hidden" th:replace="~{fragments/layout :: csrf}">
                    <div class="alert alert-danger rounded-3" th:if="${errorMessage}">
                        <p class="mb-0" th:text="${errorMessage}"></p>
                    </div>
                    <div class="mb-3">
                        <label for="adminSetupPassword" class="form-label">New password</label>
                        <div class="input-group">
                            <input id="adminSetupPassword" type="password" class="form-control" name="password"
                                   autocomplete="new-password">
                            <button type="button" class="btn btn-outline-secondary sz-password-toggle" aria-label="Show password">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="form-text">At least 8 characters with a letter and number.</div>
                    </div>
                    <div class="mb-3">
                        <label for="adminSetupConfirmPassword" class="form-label">Confirm password</label>
                        <div class="input-group">
                            <input id="adminSetupConfirmPassword" type="password" class="form-control" name="confirmPassword"
                                   autocomplete="new-password">
                            <button type="button" class="btn btn-outline-secondary sz-password-toggle" aria-label="Show password">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button class="btn btn-primary sz-btn-landing-primary" type="submit">Set password and sign in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/public-layout :: public-footer}"></footer>
<th:block th:replace="~{fragments/public-layout :: scripts}"></th:block>
</body>
</html>
