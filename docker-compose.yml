services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholarzim}
      MYSQL_USER: ${MYSQL_USER:-scholarzim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholarzim_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # Bound to localhost only, and only useful for connecting a DB client from
    # the host (e.g. MySQL Workbench/IntelliJ) — the app never uses this port,
    # it talks to mysql:3306 over the internal Docker network. Defaults to
    # 3307 since a native MySQL install commonly already owns 3306.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scholarzim

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - scholarzim

  app:
    # Root context + root Dockerfile: builds the React app in frontend/ and
    # bakes it into the Spring jar, so one container serves API and UI.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-scholarzim}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-scholarzim}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-scholarzim_dev_password}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SCHOLARZIM_APP_BASE_URL: ${SCHOLARZIM_APP_BASE_URL:-http://localhost:8080}
      SCHOLARZIM_UPLOAD_DIR: /app/uploads
      SCHOLARZIM_DEMO_SEED: ${SCHOLARZIM_DEMO_SEED:-true}
    volumes:
      # Bind-mounted (not a named volume) so the files already sitting in
      # ./backend/uploads locally are used as-is and stay visible/backed-up on
      # the host — nothing to migrate, nothing hidden inside a Docker volume.
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - scholarzim

volumes:
  mysql_data:

networks:
  scholarzim:
