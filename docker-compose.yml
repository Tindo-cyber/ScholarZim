services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-scholarzim}
      MYSQL_USER: ${DB_USERNAME:-scholarzim}
      MYSQL_PASSWORD: ${DB_PASSWORD:-scholarzim_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # Bound to localhost only, and only useful for connecting a DB client from
    # the host (e.g. MySQL Workbench/TablePlus) — the app never uses this port,
    # it talks to mysql:3306 over the internal Docker network. Defaults to
    # 3307 since a native MySQL install commonly already owns 3306.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scholarzim

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - scholarzim

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8080"
    environment:
      APP_NAME: ScholarZim
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: Africa/Harare
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-scholarzim}
      DB_USERNAME: ${DB_USERNAME:-scholarzim}
      DB_PASSWORD: ${DB_PASSWORD:-scholarzim_dev_password}
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@scholarzim.co.zw
      MAIL_FROM_NAME: ScholarZim
      SCHOLARZIM_DEMO_SEED: ${SCHOLARZIM_DEMO_SEED:-true}
    volumes:
      # Bind-mounted (not a named volume) so uploaded documents stay visible
      # and backed-up on the host rather than hidden inside a Docker volume.
      - ./storage/app:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - scholarzim

volumes:
  mysql_data:

networks:
  scholarzim:
