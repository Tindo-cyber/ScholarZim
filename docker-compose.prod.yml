# Production stack for ScholarZim (VPS / Docker)
# Usage:
#   1. Copy .env.prod.example to .env.prod and fill secrets
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Put Nginx (or Caddy) in front with TLS for www.scholarzim.co.zw

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-scholarzim}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - scholarzim

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_NAME: ScholarZim
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://www.scholarzim.co.zw}
      APP_TIMEZONE: Africa/Harare
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      SESSION_SECURE_COOKIE: "true"
      # TLS stops at the reverse proxy, so the scheme arrives in
      # X-Forwarded-Proto. Without a trusted proxy the app reads every request
      # as plain HTTP and never sends HSTS. Safe as "*" only because the port
      # below is published on 127.0.0.1, so the proxy is the sole caller.
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-scholarzim}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@scholarzim.co.zw}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ScholarZim}
      SCHOLARZIM_DEMO_SEED: "false"
    volumes:
      - upload_prod_data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholarzim

volumes:
  mysql_prod_data:
  upload_prod_data:

networks:
  scholarzim:
